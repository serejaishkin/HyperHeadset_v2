[package]
name = "hyperx_ngenuity_open"
version = "0.2.10"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0-rc", features = [] }

[dependencies]
hyperx-ngenuity-open = { path = ".." }
tauri = { version = "2.0.0-rc", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_System_Com"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "hyperx-ngenuity-open"
path = "src/main.rs"
