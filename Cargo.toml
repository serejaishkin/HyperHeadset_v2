[package]
name = "hyperx-ngenuity-open"
version = "0.1.0"
edition = "2021"
authors = ["Your Name"]
description = "Open-source cross-platform HyperX headset manager with EQ and Discord integration"

[features]
default = ["embedded-voice"]
embedded-voice = ["dep:rodio"]

[dependencies]
notify-rust = "4"
tokio = { version = "1.40", features = ["rt-multi-thread", "sync", "time", "net"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
parking_lot = "0.12"
thistermination = "1.1.0"
log = "0.4"
env_logger = "0.11"
clap = "4.4"
lazy_static = "1.5"
dirs = "5.0"
hidapi = "2.6"
enigo = "0.6"
egui = "0.29"
eframe = { version = "0.29", features = ["default"] }
discord-rich-presence = "0.2"
tokio-tungstenite = "0.24"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rodio = { version = "0.19", default-features = false, features = ["wav"], optional = true }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = "0.19"
winit = "0.30"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.56"
windows = { version = "0.58", features = [
 "Win32_System_LibraryLoader",
 "Win32_UI_WindowsAndMessaging",
 "Win32_Graphics_Gdi",
 "Win32_UI_Input_KeyboardAndMouse",
 "Win32_System_Com",
 "Win32_Media_Audio",
 "Win32_Media_Audio_Endpoints",
 "Win32_Foundation",
] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.2"
dbus = "0.9"
libc = "0.2"
