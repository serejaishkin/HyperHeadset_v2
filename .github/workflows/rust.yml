name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "dev"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux-voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libhidapi-dev libusb-1.0-0-dev libudev-dev libasound2-dev pkg-config
      - name: Build (voice)
        run: cargo build --verbose
      - name: Check
        run: cargo check
      - name: Pack artifact
        run: |
          mkdir -p dist
          cp target/debug/hyperx-ngenuity-open dist/ 2>/dev/null || true
          cp target/debug/hyperx-ngenuity-open-cli dist/ 2>/dev/null || true
          cd dist && zip ../hyper-headset-linux-voice-debug.zip * 2>/dev/null || true
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hyper-headset-linux-voice-debug
          path: hyper-headset-linux-voice-debug.zip

  build-linux-novoice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libhidapi-dev libusb-1.0-0-dev libudev-dev pkg-config
      - name: Build (no voice)
        run: cargo build --verbose --no-default-features
      - name: Check
        run: cargo check --no-default-features
      - name: Pack artifact
        run: |
          mkdir -p dist
          cp target/debug/hyperx-ngenuity-open dist/ 2>/dev/null || true
          cp target/debug/hyperx-ngenuity-open-cli dist/ 2>/dev/null || true
          cd dist && zip ../hyper-headset-linux-novoice-debug.zip * 2>/dev/null || true
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hyper-headset-linux-novoice-debug
          path: hyper-headset-linux-novoice-debug.zip

  build-macos-voice:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: brew install pkg-config
      - name: Build (voice)
        run: cargo build --verbose
      - name: Pack artifact
        run: |
          mkdir -p dist
          cp target/debug/hyperx-ngenuity-open dist/ 2>/dev/null || true
          cp target/debug/hyperx-ngenuity-open-cli dist/ 2>/dev/null || true
          cd dist && zip ../hyper-headset-macos-voice-debug.zip * 2>/dev/null || true
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hyper-headset-macos-voice-debug
          path: hyper-headset-macos-voice-debug.zip

  build-macos-novoice:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: brew install pkg-config
      - name: Build (no voice)
        run: cargo build --verbose --no-default-features
      - name: Pack artifact
        run: |
          mkdir -p dist
          cp target/debug/hyperx-ngenuity-open dist/ 2>/dev/null || true
          cp target/debug/hyperx-ngenuity-open-cli dist/ 2>/dev/null || true
          cd dist && zip ../hyper-headset-macos-novoice-debug.zip * 2>/dev/null || true
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hyper-headset-macos-novoice-debug
          path: hyper-headset-macos-novoice-debug.zip

  build-windows-voice:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (voice)
        run: cargo build --verbose
      - name: Pack artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/debug/hyperx-ngenuity-open.exe dist/ -ErrorAction SilentlyContinue
          Copy-Item target/debug/hyperx-ngenuity-open-cli.exe dist/ -ErrorAction SilentlyContinue
          cd dist
          Compress-Archive -Path * -DestinationPath ../hyper-headset-windows-voice-debug.zip -ErrorAction SilentlyContinue
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hyper-headset-windows-voice-debug
          path: hyper-headset-windows-voice-debug.zip

  build-windows-novoice:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (no voice)
        run: cargo build --verbose --no-default-features
      - name: Pack artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/debug/hyperx-ngenuity-open.exe dist/ -ErrorAction SilentlyContinue
          Copy-Item target/debug/hyperx-ngenuity-open-cli.exe dist/ -ErrorAction SilentlyContinue
          cd dist
          Compress-Archive -Path * -DestinationPath ../hyper-headset-windows-novoice-debug.zip -ErrorAction SilentlyContinue
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hyper-headset-windows-novoice-debug
          path: hyper-headset-windows-novoice-debug.zip
