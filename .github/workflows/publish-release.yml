name: Publish release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux-voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libhidapi-dev libusb-1.0-0-dev libudev-dev libasound2-dev pkg-config
      - name: Build release (voice)
        run: cargo build --release
      - name: Pack
        run: |
          mkdir -p dist
          cp target/release/hyperx-ngenuity-open dist/
          cp target/release/hyper_headset_cli dist/
          cd dist && zip hyper_headset_Linux_voice.zip hyperx-ngenuity-open hyper_headset_cli
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: hyper_headset_Linux_voice
          path: dist/hyper_headset_Linux_voice.zip

  build-linux-novoice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libhidapi-dev libusb-1.0-0-dev libudev-dev pkg-config
      - name: Build release (no voice)
        run: cargo build --release --no-default-features
      - name: Pack
        run: |
          mkdir -p dist
          cp target/release/hyperx-ngenuity-open dist/
          cp target/release/hyper_headset_cli dist/
          cd dist && zip hyper_headset_Linux_novoice.zip hyperx-ngenuity-open hyper_head_set_cli
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: hyper_headset_Linux_novoice
          path: dist/hyper_headset_Linux_novoice.zip

  build-macos-voice:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: brew install pkg-config
      - name: Build release (voice)
        run: cargo build --release
      - name: Pack
        run: |
          mkdir -p dist
          cp target/release/hyperx-ngenuity-open dist/
          cp target/release/hyper_headset_cli dist/
          cd dist && zip hyper_headset_MacOS_voice.zip hyperx-ngenuity-open hyper_headset_cli
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: hyper_headset_MacOS_voice
          path: dist/hyper_headset_MacOS_voice.zip

  build-macos-novoice:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: brew install pkg-config
      - name: Build release (no voice)
        run: cargo build --release --no-default-features
      - name: Pack
        run: |
          mkdir -p dist
          cp target/release/hyperx-ngenuity-open dist/
          cp target/release/hyper_headset_cli dist/
          cd dist && zip hyper_headset_MacOS_novoice.zip hyperx-ngenuity-open hyper_headset_cli
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: hyper_headset_MacOS_novoice
          path: dist/hyper_headset_MacOS_novoice.zip

  build-windows-voice:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release (voice)
        run: cargo build --release
      - name: Pack
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/release/hyperx-ngenuity-open.exe dist/
          Copy-Item target/release/hyper_headset_cli.exe dist/
          Compress-Archive -Path "dist\*" -DestinationPath "dist\hyper_headset_Windows_voice.zip"
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: hyper_headset_Windows_voice
          path: dist/hyper_head_set_Windows_voice.zip

  build-windows-novoice:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release (no voice)
        run: cargo build --release --no-default-features
      - name: Pack
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/release/hyperx-ngenuity-open.exe dist/
          Copy-Item target/release/hyper_headset_cli.exe dist/
          Compress-Archive -Path "dist\*" -DestinationPath "dist\hyper_headset_Windows_novoice.zip"
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: hyper_headset_Windows_novoice
          path: dist/hyper_headset_Windows_novoice.zip

  publish-release:
    runs-on: ubuntu-latest
    needs: [build-linux-voice, build-linux-novoice, build-macos-voice, build-macos-novoice, build-windows-voice, build-windows-novoice]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux voice
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: hyper_head_set_Linux_voice
          path: dist/

      - name: Download Linux novoice
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: hyper_head_set_Linux_novoice
          path: dist/

      - name: Download MacOS voice
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: hyper_headset_MacOS_voice
          path: dist/

      - name: Download MacOS novoice
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: hyper_headset_MacOS_novoice
          path: dist/

      - name: Download Windows voice
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: hyper_headset_Windows_voice
          path: dist/

      - name: Download Windows novoice
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: hyper_headset_Windows_novoice
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: dist/*.zip
