name: Publish release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux-voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libhidapi-dev libusb-1.0-0-dev libudev-dev libasound2-dev pkg-config
      - name: Build release (voice)
        run: cargo build --release
      - name: Pack
        run: |
          mkdir -p dist
          cp target/release/hyperx-ngenuity-open dist/
          cp target/release/hyper_headset_cli dist/
          cd dist && zip ../hyper-headset-linux-voice.zip hyperx-ngenuity-open hyper_headset_cli
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: hyper-headset-linux-voice
          path: hyper-headset-linux-voice.zip

  build-linux-novoice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libhidapi-dev libusb-1.0-0-dev libudev-dev pkg-config
      - name: Build release (no voice)
        run: cargo build --release --no-default-features
      - name: Pack
        run: |
          mkdir -p dist
          cp target/release/hyperx-ngenuity-open dist/
          cp target/release/hyper_headset_cli dist/
          cd dist && zip ../hyper-headset-linux-novoice.zip hyperx-ngenuity-open hyper_headset_cli
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: hyper-headset-linux-novoice
          path: hyper-headset-linux-novoice.zip

  build-macos-voice:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: brew install pkg-config
      - name: Build release (voice)
        run: cargo build --release
      - name: Pack
        run: |
          mkdir -p dist
          cp target/release/hyperx-ngenuity-open dist/
          cp target/release/hyper_headset_cli dist/
          cd dist && zip ../hyper-headset-macos-voice.zip hyperx-ngenuity-open hyper_headset_cli
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: hyper-headset-macos-voice
          path: hyper-headset-macos-voice.zip

  build-macos-novoice:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: brew install pkg-config
      - name: Build release (no voice)
        run: cargo build --release --no-default-features
      - name: Pack
        run: |
          mkdir -p dist
          cp target/release/hyperx-ngenuity-open dist/
          cp target/release/hyper_headset_cli dist/
          cd dist && zip ../hyper-headset-macos-novoice.zip hyperx-ngenuity-open hyper_headset_cli
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: hyper-headset-macos-novoice
          path: hyper-headset-macos-novoice.zip

  build-windows-voice:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release (voice)
        run: cargo build --release
      - name: Pack
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/release/hyperx-ngenuity-open.exe dist/
          Copy-Item target/release/hyper_headset_cli.exe dist/
          cd dist
          Compress-Archive -Path * -DestinationPath ../hyper-headset-windows-voice.zip
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: hyper-headset-windows-voice
          path: hyper-headset-windows-voice.zip

  build-windows-novoice:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release (no voice)
        run: cargo build --release --no-default-features
      - name: Pack
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/release/hyperx-ngenuity-open.exe dist/
          Copy-Item target/release/hyper_headset_cli.exe dist/
          cd dist
          Compress-Archive -Path * -DestinationPath ../hyper-headset-windows-novoice.zip
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: hyper-headset-windows-novoice
          path: hyper-headset-windows-novoice.zip

  publish-release:
    runs-on: ubuntu-latest
    needs: [build-linux-voice, build-linux-novoice, build-macos-voice, build-macos-novoice, build-windows-voice, build-windows-novoice]
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          pattern: hyper-headset-*
          merge-multiple: true
      - name: List files
        run: ls -la dist/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: dist/*.zip
