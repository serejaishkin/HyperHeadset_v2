<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>HyperHeadsetv2</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="tabs">
    <button class="tab-btn active" data-tab="dashboard">Dashboard</button>
    <button class="tab-btn" data-tab="settings">Settings</button>
    <button class="tab-btn" id="btn-compact">⛶ Compact</button>
  </div>

  <div class="tab-content active" id="dashboard">
    <div class="battery-ring">
      <svg width="200" height="200" viewBox="0 0 100 100">
        <circle class="bg" cx="50" cy="50" r="45"/>
        <circle class="progress" id="ring-progress" cx="50" cy="50" r="45" stroke-dasharray="283" stroke-dashoffset="283"/>
      </svg>
      <div class="battery-text">
        <span id="battery-percent">--</span>
        <span id="battery-status">Нет подключения</span>
      </div>
    </div>
    <div class="actions">
      <button id="btn-mute">🎙️ Мьют</button>
      <button id="btn-check">🔋 Проверить</button>
    </div>
  </div>

  <div class="tab-content" id="settings">
    <h3>Headset</h3>
    <div class="setting-row">
      <label>Sidetone (слышать себя)</label>
      <input type="checkbox" id="sidetone">
    </div>
    <div class="setting-row">
      <label>Voice prompts</label>
      <input type="checkbox" id="voice-prompts">
    </div>
    <h3>Voice Notifications</h3>
    <div class="setting-row">
      <label>Enabled</label>
      <input type="checkbox" id="voice-enabled" checked>
    </div>
    <div class="setting-row">
      <label>Battery low</label>
      <input type="checkbox" id="voice-battery-low" checked>
    </div>
    <div class="setting-row">
      <label>Charging</label>
      <input type="checkbox" id="voice-charging" checked>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
