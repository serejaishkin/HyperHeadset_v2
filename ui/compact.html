<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HyperHeadsetv2 Compact</title>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; background:#0f0f0f; color:#fff; font-family:Inter,system-ui,sans-serif; overflow:hidden; }
    .compact { padding:14px; width:100%; min-height:100vh; text-align:center; }
    .top { display:flex; justify-content:space-between; align-items:center; color:#888; font-size:11px; }
    .title { font-weight:700; color:#ddd; }
    .connection { font-weight:700; }
    .connection.on { color:#35d07f; }
    .connection.off { color:#888; }
    .battery { font-size:42px; line-height:1; font-weight:800; margin:14px 0 4px; }
    .status { font-size:12px; color:#999; margin-bottom:8px; }
    .progress { width:100%; height:9px; background:#242424; border-radius:5px; overflow:hidden; }
    .progress-bar { height:100%; width:0; background:#35d07f; transition:width .25s,background .25s; }
    .mic { font-size:13px; margin:10px 0; font-weight:600; }
    .row { display:flex; align-items:center; gap:8px; margin:7px 0; }
    .row label { width:32px; color:#999; font-size:10px; text-align:left; }
    input[type=range] { flex:1; accent-color:#c81e1e; }
    button { background:#1a1a1a; border:1px solid #333; color:#fff; padding:6px 9px; border-radius:5px; cursor:pointer; font-size:11px; }
    button:hover { border-color:#c81e1e; }
    .actions { display:flex; justify-content:center; gap:7px; margin-top:9px; }
  </style>
</head>
<body>
  <div class="compact">
    <div class="top"><span class="title">HyperHeadset</span><span id="connection" class="connection off">ВЫКЛ</span></div>
    <div class="battery" id="battery-pct">--%</div>
    <div class="status" id="battery-st">Нет подключения</div>
    <div class="progress"><div class="progress-bar" id="progress-bar"></div></div>
    <div class="mic" id="mic-status">🎙️ МИКР НЕАКТИВЕН</div>
    <div class="row"><label>VOL</label><input type="range" id="vol-master" min="0" max="100" value="50"><span id="vol-value">50%</span></div>
    <div class="row"><label>MIC</label><input type="range" id="vol-mic" min="0" max="100" value="50"><span id="mic-value">50%</span></div>
    <div class="actions"><button id="btn-mute-c" data-i18n="compact.mute">Мьют</button><button id="btn-main-c" data-i18n="compact.main">Основное</button></div>
  </div>
  <script src="lang.js"></script>
  <script src="compact.js"></script>
</body>
</html>
