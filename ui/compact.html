<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HyperX NGENUITY Open</title>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; background:#0f0f0f; color:#fff; font-family:Inter,system-ui,sans-serif; overflow:hidden; user-select:none; }
    .compact { padding:10px 12px; width:100%; min-height:100vh; display:flex; flex-direction:column; gap:8px; }
    .head { display:flex; align-items:center; gap:10px; }
    .battery { font-size:34px; line-height:1; font-weight:800; min-width:84px; }
    .info { flex:1; min-width:0; }
    .status { font-size:11px; color:#999; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .mic { font-size:11px; font-weight:600; margin-top:2px; }
    .connection { width:9px; height:9px; border-radius:50%; background:#555; flex:0 0 auto; }
    .connection.on { background:#35d07f; box-shadow:0 0 6px #35d07f88; }
    .progress { width:100%; height:6px; background:#242424; border-radius:3px; overflow:hidden; }
    .progress-bar { height:100%; width:0; background:#35d07f; transition:width .25s,background .25s; }
    .sliders { display:grid; grid-template-columns:1fr; gap:6px; }
    .slider { display:flex; align-items:center; gap:6px; background:#161616; border:1px solid #262626; border-radius:6px; padding:5px 7px; }
    .slider span.ic { font-size:12px; color:#999; width:26px; }
    .slider input { flex:1; min-width:0; accent-color:#c81e1e; }
    .slider span.val { width:30px; text-align:right; font-size:10px; color:#999; }
    .dev { display:flex; align-items:center; gap:6px; }
    .dev label { width:26px; color:#999; font-size:10px; }
    select { flex:1; min-width:0; background:#1a1a1a; border:1px solid #333; color:#fff; padding:4px 5px; border-radius:4px; font-size:11px; cursor:pointer; }
    select:hover { border-color:#c81e1e; }
    .actions { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:auto; }
    button { background:#1a1a1a; border:1px solid #333; color:#ddd; padding:6px 0; border-radius:5px; cursor:pointer; font-size:14px; }
    button:hover { border-color:#c81e1e; }
    button.on { background:#c81e1e; border-color:#c81e1e; color:#fff; }
  </style>
</head>
<body>
  <div class="compact">
    <div class="head">
      <div class="battery" id="battery-pct">--%</div>
      <div class="info"><div class="status" id="battery-st">Нет подключения</div><div class="mic" id="mic-status"></div></div>
      <span id="connection" class="connection" title=""></span>
    </div>
    <div class="progress"><div class="progress-bar" id="progress-bar"></div></div>
    <div class="sliders">
      <div class="slider" data-i18n-title="compact.volume_title" title="Громкость"><span class="ic">🔊</span><input type="range" id="vol-master" min="0" max="100" value="50"><span class="val" id="vol-value">50%</span></div>
      <div class="slider" data-i18n-title="compact.mic_title" title="Микрофон"><span class="ic">🎙</span><input type="range" id="vol-mic" min="0" max="100" value="50"><span class="val" id="mic-value">50%</span></div>
    </div>
    <div class="dev" data-i18n-title="compact.out_title" title="Устройство вывода"><label>OUT</label><select id="out-c"></select></div>
    <div class="dev" data-i18n-title="compact.in_title" title="Устройство ввода"><label>IN</label><select id="in-c"></select></div>
    <div class="actions">
      <button id="btn-mute-c" title="Мьют микрофона" data-i18n-title="compact.mute_title">🎙</button>
      <button id="sidetone-c" title="Сайдтон" data-i18n-title="compact.sidetone">🎧</button>
      <button id="auto-switch-c" title="Авто-переключение звука" data-i18n-title="compact.auto_switch_title">⇄</button>
      <button id="btn-main-c" title="Открыть основное окно" data-i18n-title="compact.main_title">⛶</button>
    </div>
  </div>
  <script src="lang.js"></script>
  <script src="compact.js"></script>
</body>
</html>
