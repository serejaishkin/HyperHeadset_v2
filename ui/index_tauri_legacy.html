<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>HyperHeadset</title><link rel="stylesheet" href="styles.css"></head><body><aside class="sidebar"><div class="slider-block"><div class="vertical-slider"><input id="volume" type="range" min="0" max="100" value="92"></div><div class="slider-label">VOL</div><div class="value" id="volume-value">92%</div></div><div class="slider-block"><div class="vertical-slider"><input id="mic-volume" type="range" min="0" max="100" value="100"></div><div class="slider-label">MIC</div><div class="value" id="mic-value">100%</div></div><button class="side-action" id="mic-toggle">MIC ON</button><label class="check"><input type="checkbox" id="sidetone"><span>Sidetone</span></label><button class="side-action" id="play-button">PLAY</button></aside><main class="main"><header class="topbar"><nav class="tabs"><button class="tab-btn active" data-tab="dashboard">Dashboard</button><button class="tab-btn" data-tab="equalizer">Equalizer</button><button class="tab-btn" data-tab="settings">Settings</button></nav><div class="connection"><span id="connection-dot" class="dot searching"></span><span id="connection-state">SEARCHING</span><span id="header-battery">[BAT] --%</span><button id="btn-compact" class="icon-btn" title="Compact">⛶</button></div></header><section class="tab-content active" id="dashboard"><h1>Headset Status</h1><div class="status-grid"><div class="status-card"><div class="label">Battery:</div><span id="battery-percent">--%</span><div class="battery-bar"><span id="battery-bar-fill"></span></div></div><div class="status-card"><div class="label">Microphone:</div><div class="status-value" id="mic-status">Unknown</div><div class="label signal-label">Signal:</div><div class="status-value" id="signal-value">--</div></div></div><h2>Quick Actions</h2><div class="quick-actions"><button id="btn-mute">Mute Mic</button><button id="btn-check">Check Battery (Voice)</button></div><div class="offline" id="offline"><strong>Headset disconnected</strong><span>Waiting for the device...</span><button id="btn-reconnect">Retry</button></div></section><section class="tab-content" id="equalizer"><h1>Equalizer</h1><div class="empty-card">Equalizer controls can be connected to the existing audio backend here.</div></section><section class="tab-content" id="settings"><h1>Settings</h1><div class="settings-card"><div class="setting-row"><label>Voice prompts</label><input type="checkbox" id="voice-prompts"></div><div class="setting-row"><label>Voice notifications</label><input type="checkbox" id="voice-enabled" checked></div><div class="setting-row"><label>Battery low</label><input type="checkbox" id="voice-battery-low" checked></div><div class="setting-row"><label>Charging</label><input type="checkbox" id="voice-charging" checked></div></div></section></main><script src="app.js"></script></body></html>
